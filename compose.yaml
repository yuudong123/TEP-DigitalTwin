services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: tep-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://100.127.7.26:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka-data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      - tep-network


  kafka-init:
    image: apache/kafka:4.1.0

    depends_on:
      kafka:
        condition: service_healthy

    command:
      [
        "/opt/kafka/bin/kafka-topics.sh",
        "--bootstrap-server",
        "kafka:19092",
        "--create",
        "--if-not-exists",
        "--topic",
        "tep-sensor-data",
        "--partitions",
        "1",
        "--replication-factor",
        "1"
      ]

    restart: "no"

    networks:
      - tep-network


  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api

    container_name: tep-api

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"

    depends_on:
      kafka:
        condition: service_healthy

    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs

    restart: unless-stopped

    networks:
      - tep-network


  inference:
    build:
      context: .
      dockerfile: docker/Dockerfile.inference

    container_name: tep-inference

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    depends_on:
      kafka:
        condition: service_healthy

    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs

    restart: unless-stopped

    networks:
      - tep-network


  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor

    container_name: tep-monitor

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    depends_on:
      kafka:
        condition: service_healthy

    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs

    restart: unless-stopped

    networks:
      - tep-network


volumes:
  kafka-data:
    external: true
    name: tep-kafka-data

networks:
  tep-network:
    name: tep-network
    driver: bridge
